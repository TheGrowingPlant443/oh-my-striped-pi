name: Warm bun store cache

# Produces the shared `bun-<os>-<lockhash>` store entry hosted PR jobs restore.
# PR jobs restore it but never save per-PR-ref copies against the repo quota.
# Main jobs also save this cache; this workflow warms dependency-only pushes.

on:
   push:
      branches: [main]
      paths:
         - "bun.lock"
         - ".github/actions/bun-install/**"
         - ".github/workflows/bun-cache-warm.yml"
   workflow_dispatch:

permissions:
   contents: read

# No cancel-in-progress: a cancelled warm saves nothing. Superseded queued runs
# still collapse to the newest one.
concurrency:
   group: bun-cache-warm
   cancel-in-progress: false

jobs:
   warm_bun:
      name: Seed bun store cache
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
