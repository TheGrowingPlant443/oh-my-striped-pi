name: "Compose bazel cache config"
description: >
   Emits a bazelrc fragment with --config=ci for hosted CI. Optional
   externally provisioned vmon runners (VMON_CI=1) use repository/xwin
   caches at /opt/bazel-repo-cache and, when VMON_CACHE_URL is set, its
   Bazel HTTP cache. Pull requests disable uploads; other events enable
   them. This repository does not provision the runner or cache service.

outputs:
   rc:
      description: Path to the generated bazelrc fragment
      value: ${{ steps.compose.outputs.rc }}

runs:
   using: composite
   steps:
      - name: Compose cache config
        id: compose
        shell: bash
        run: |
           set -euo pipefail
           rc="$RUNNER_TEMP/bazel-cache.rc"
           echo "rc=$rc" >> "$GITHUB_OUTPUT"
           if [ "${VMON_CI:-}" != 1 ]; then
             echo "::notice title=Bazel cache::Not a vmon runner; building uncached."
             echo "common --config=ci" > "$rc"
             exit 0
           fi

           # External runners must provision these paths themselves.
           # The retired template builder no longer warms them.
           {
             echo "common --config=ci"
             echo "common --repository_cache=/opt/bazel-repo-cache"
             echo "common --repo_env=OMSP_XWIN_CACHE_DIR=/opt/bazel-repo-cache/xwin"
           } > "$rc"

           if [ -z "${VMON_CACHE_URL:-}" ]; then
             echo "::warning title=Bazel cache::The vmon node serves no Bazel cache; building without a remote cache."
             exit 0
           fi
           # The node refuses writes from pull request jobs; PRs
           # (pull_request_target included) skip uploads instead of
           # collecting 403 warnings.
           case "${GITHUB_EVENT_NAME:-}" in
             pull_request*) mode=cache-ro ;;
             *) mode=cache-rw ;;
           esac
           {
             echo "common --config=${mode}"
             echo "common --remote_cache=${VMON_CACHE_URL}/bazel"
           } >> "$rc"
           echo "::notice title=Bazel cache::Using the vmon node's Bazel cache (${mode})."
